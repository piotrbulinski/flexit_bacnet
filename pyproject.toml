[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flexit_bacnet"
version = "2.2.3"
authors = [
  { name="Piotr Buliński" },
]
description = "Client BACnet library for Flexit Nordic series of air handling units."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/piotrbulinski/flexit_bacnet"
"Bug Tracker" = "https://github.com/piotrbulinski/flexit_bacnet/issues"
[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/live needs a real Flexit unit on the network
addopts = "--ignore=tests/live"
